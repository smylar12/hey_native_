<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Native Plant Matching Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="navbar">
            <nav>
                <ul>
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="../../2About/about.html">About</a></li>
                    <li><a href="../meetThePlants.html">Meet the Plants</a></li>
                    <li><a href="../../4Layout/layout.html">Layout of Garden</a></li>
                    <li><a href="../../5getInvolved/getInvolved.html">Get Involved</a></li>
                </ul>
            </nav>
        </div>
        
        <div class="container">
            <h1>Native Plant Matching Game</h1>
            
            <div class="stats">
                <p>Score: <span class="score">0</span></p>
                <p>Time: <span class="timer">0:00</span></p>
            </div>
            
            <div class="actions">
                <button onclick="restart()">Restart Game</button>
            </div>
            
            <div class="grid-container"></div>
        </div>
        
        <div class="congratulations-modal" id="congratsModal">
            <div class="modal-content">
                <div class="modal-header">⭐ Congratulations! ⭐</div>
                <div class="modal-body">
                    <p>You completed the game in <span id="finalTime">0:00</span>seconds!</p>
                </div>
                <div class="modal-footer">
                    <button onclick="closeCongratsModal()">Play Again</button>
                </div>
            </div>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
