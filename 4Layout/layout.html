<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="layout.css" />
  </head>
  <body>
    <div class="container">
      <div class="navbar">
        <!-- <img src = "image file ( logo)" -->
        <nav>
          <ul>
            <li><a href="../index.html"> Home</a></li>
            <li><a href="../2About/about.html">About</a></li>
            <li><a href="../3Meet the Plants/meetThePlants.html"> Meet the plants</a></li>
            <li><a href="../4Layout/layout.html"> Layout of Garden</a></li>
            <li><a href="../5getInvolved/getInvolved.html"> Get involved</a></li>
          </ul>
        </nav>
      </div>
      <h1>Layout of the Native Plant Garden</h1>
      <hr>
      <br>
      <h2>Google Maps image of the site</h2>
      <img src="Google Maps.png" alt="Google Maps image of the garden layout. A bit blurry." class="map-image" />
      <br />
      <h2>Layout</h2>
      <img src="Layout.png" alt="The blueprint for the garden made by Girl Scout Ambassador, Surabhi Mylar." class="layout-image" />
      <br />
      <h2>Plant Key</h2>
      <img src="Plant Key.png" alt="A key to the plants in the garden" class="plant-key-image" />
      <hr />
      <div class="footer l-box">
        <p>Project lead by Girl Scout Ambassador, Surabhi Mylar, Troop 2948</p>
      </div>
    </div>

    <div id="lightbox" class="lightbox-overlay" aria-hidden="true">
      <button class="lightbox-close" aria-label="Close lightbox">×</button>
      <img src="" alt="Enlarged layout image" id="lightbox-image" />
    </div>

    <script>
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightbox-image');
      const closeBtn = document.querySelector('.lightbox-close');
      const layoutImages = document.querySelectorAll('.map-image, .layout-image, .plant-key-image');

      layoutImages.forEach((img) => {
        img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => {
          lightboxImage.src = img.src;
          lightboxImage.alt = img.alt;
          lightbox.classList.add('active');
          lightbox.setAttribute('aria-hidden', 'false');
        });
      });

      function closeLightbox() {
        lightbox.classList.remove('active');
        lightbox.setAttribute('aria-hidden', 'true');
      }

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && lightbox.classList.contains('active')) {
          closeLightbox();
        }
      });
    </script>
  </body>
</html>
